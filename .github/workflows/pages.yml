name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build WASM distribution
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:wasmJsBrowserDistribution --console=plain

      # Il workflow distribuisce la cartella statica prodotta da Gradle.
      # window.__RIPLAY_API__ punta al worker pubblico: sostituire
      # RIPLAY_API_URL con l'URL reale dopo il primo deploy del worker.
      - name: Configure worker URL + SPA fallback
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          ls -la "$DIST"
          API_URL="${{ vars.RIPLAY_API_URL }}"
          if [ -z "$API_URL" ]; then API_URL="http://localhost:8787"; fi
          echo "Worker URL: $API_URL"
          sed -i "s|<script src=\"riplay.js\">|<script>window.__RIPLAY_API__ = \"$API_URL\";</script><script src=\"./riplay.js\">|" "$DIST/index.html"
          cp "$DIST/index.html" "$DIST/404.html"
          touch "$DIST/.nojekyll"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
